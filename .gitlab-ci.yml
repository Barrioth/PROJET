stages:
  - test
  - build
  - deploy

image: docker:24.0.5
services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

before_script:
  - apk add --no-cache python3 py3-pip
  - python3 --version
  - pip3 install -r requirements.txt || true

tests:
  tags:
    - dockerbr
  stage: test
  script:
    - echo "Running Python tests"
    - pip3 install pytest
    - pytest || echo "No tests yet"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

build_container:
  stage: build
  tags:
    - dockerbr
  script:
    - docker info
    - docker build -t pasta-web:local .
    - echo "Build OK"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy_production:
  stage: deploy
  tags:
    - dockerbr
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y openssh-client
    - pip install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_pasta
    - chmod 600 ~/.ssh/id_ed25519_pasta
  script:
    - echo "Deploying to GCP VM..."
    - ansible-playbook -i terraform/inventory.ini playbook.yml
  rules:
    - if: $CI_COMMIT_BRANCH == "8"