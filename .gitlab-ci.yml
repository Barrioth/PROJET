stages:
  - test
  - build
  - release
  
image: python:3.11

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

before_script:
  - python --version
  - pip install -r requirements.txt || true

# -------------------------
# TESTS
# -------------------------
tests:
  stage: test
  script:
    - echo "Running tests for app"
    - pip install pytest
    - pytest || echo "No tests yet"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# -------------------------
# BUILD EXE
# -------------------------
build_container:
  stage: build
  script:
    - docker build -t pasta-web:local .

run_container:
  stage: release
  script:
    - docker run --rm -p 8000:8000 pasta-web:local
