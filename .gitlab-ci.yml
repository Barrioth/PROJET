stages:
  - test
  - deploy

tests:
  stage: test
  tags:
    - dockerbr
  script:
    - echo "Running tests"
    - python --version
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy_production:
  stage: deploy
  tags:
    - dockerbr
script:
    - wsl mkdir -p ~/.ssh
    - $env:SSH_PRIVATE_KEY | Out-File -FilePath "C:\GitLab-Runner\ssh_key.tmp" -Encoding ascii -NoNewline
    - wsl bash -c "tr -d '\r' < /mnt/c/GitLab-Runner/ssh_key.tmp > ~/.ssh/id_ed25519_pasta && chmod 600 ~/.ssh/id_ed25519_pasta && rm /mnt/c/GitLab-Runner/ssh_key.tmp"
    - wsl bash -c "ssh-keygen -l -f ~/.ssh/id_ed25519_pasta"
    - wsl bash -c "cd /mnt/c/GitLab-Runner/builds/Rfzfr-AOv/0/Barrioth/PROJET && ansible-playbook -i terraform/inventory.ini playbook.yml"
rules:
    - if: $CI_COMMIT_BRANCH == "9"