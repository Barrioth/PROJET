stages:
  - test
  - build
  - release

# Image Docker officielle pour Docker CLI
image: docker:24.0.5

# Service Docker-in-Docker
services:
  - docker:24.0.5-dind

# Variables pour Docker-in-Docker
variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

# -------------------------
# BEFORE SCRIPT
# -------------------------
before_script:
  # Installer Python et pip
  - apk add --no-cache python3 py3-pip
  - python3 --version
  - pip3 install --upgrade pip
  - pip3 install -r requirements.txt || true

# -------------------------
# TESTS
# -------------------------
tests:
  stage: test
  script:
    - echo "Running tests for app"
    - pip3 install pytest
    - pytest || echo "No tests yet"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# -------------------------
# BUILD CONTAINER
# -------------------------
build_container:
  stage: build
  script:
    - docker info  # vérifier que Docker fonctionne
    - docker build -t pasta-web:local .

# -------------------------
# RUN CONTAINER
# -------------------------
run_container:
  stage: release
  script:
    - docker run --rm -p 8000:8000 pasta-web:local